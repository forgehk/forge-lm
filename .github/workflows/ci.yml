name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU build of PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Train on the sample, then run the result in both implementations
        run: |
          python -m forgelm.train --data data/sample.txt --out runs/ci --steps 20
          python -m forgelm.generate runs/ci/model.flm --prompt "ROMEO:"
          cd engine && cargo run --release -- generate ../runs/ci/model.flm --prompt "ROMEO:" --tokens 40

  engine:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: No dependencies
        shell: bash
        run: test "$(cargo tree --prefix none | wc -l)" -eq 1
      - name: Test
        run: cargo test --release
      - name: Generate
        run: cargo run --release -- generate ../models/shakespeare.flm --prompt "ROMEO:" --tokens 80
