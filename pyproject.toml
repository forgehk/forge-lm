[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-lm"
version = "0.1.0"
description = "A small language model built end to end: BPE tokenizer, Llama-style transformer, trainer, and a dependency-free Rust inference engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "@forgehk", email = "info@darkforgeai.com" }]
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["forgelm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
